<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Region Byg & Rådgivning, professionel byggerådgivning og entreprise for private og erhverv. Fra idé og myndighedsgodkendelser til færdigt projekt." />
  <meta name="theme-color" content="#0A0A0A" />
  <title data-i18n="meta.title">Region Byg & Rådgivning, Byggeri med kvalitet. Rådgivning med indsigt.</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="mask-icon" href="assets/img/favicon.svg" color="#C8996A" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Region Byg & Rådgivning" />
  <meta property="og:title" content="Region Byg & Rådgivning, Byggeri med kvalitet. Rådgivning med indsigt." />
  <meta property="og:description" content="Region Byg & Rådgivning, professionel byggerådgivning og entreprise for private og erhverv. Fra idé og myndighedsgodkendelser til færdigt projekt." />
  <meta property="og:image" content="https://regionbyg.dk/assets/img/banner.jpeg" />
  <meta property="og:url" content="https://regionbyg.dk/" />
  <link rel="canonical" href="https://regionbyg.dk/" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
  <script>try{if(localStorage.getItem('rb-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="rb-header"></div>

  <main id="top">

    <!-- ============ HERO ============ -->
    <section class="hero section--photo">
      <img class="sec-bg" src="assets/img/home-build.jpg" alt="" aria-hidden="true"  fetchpriority="high" decoding="async" />
      <span class="sec-overlay"></span>
      <div class="hero__grid"></div>
      <div class="container">
        <div class="hero__inner">
          <div class="hero__content" data-reveal>
            <span class="eyebrow" data-i18n="hero.eyebrow"></span>
            <h1>
              <span data-i18n="hero.title_1"></span><br />
              <span data-i18n="hero.title_2"></span><br />
              <span class="accent" data-i18n="hero.title_3"></span>
            </h1>
            <p class="hero__lead" data-i18n="hero.lead"></p>
            <div class="hero__cta">
              <a class="btn btn--primary btn--lg" href="offer.html">
                <span data-i18n="hero.cta_offer"></span>
                <span data-icon="arrow"></span>
              </a>
              <a class="btn btn--ghost btn--lg" href="consultation.html" data-i18n="hero.cta_book"></a>
            </div>
            <p class="hero__tagline" data-i18n="hero.tagline"></p>
          </div>
        </div>

        <!-- Pillars -->
        <div class="pillars" data-reveal>
          <div class="pillar">
            <span class="pillar__icon" data-icon="home"></span>
            <h3 aria-level="2" data-i18n="pillar.new"></h3>
            <p data-i18n="pillar.new_d"></p>
          </div>
          <div class="pillar">
            <span class="pillar__icon" data-icon="reno"></span>
            <h3 aria-level="2" data-i18n="pillar.reno"></h3>
            <p data-i18n="pillar.reno_d"></p>
          </div>
          <div class="pillar">
            <span class="pillar__icon" data-icon="advice"></span>
            <h3 aria-level="2" data-i18n="pillar.advice"></h3>
            <p data-i18n="pillar.advice_d"></p>
          </div>
          <div class="pillar">
            <span class="pillar__icon" data-icon="pm"></span>
            <h3 aria-level="2" data-i18n="pillar.pm"></h3>
            <p data-i18n="pillar.pm_d"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CLIENT-TYPE CHOOSER ============ -->
    <section class="section section--photo" id="services">
      <img class="sec-bg" src="assets/img/home-site.jpg" alt="" aria-hidden="true"  loading="lazy" decoding="async" />
      <span class="sec-overlay"></span>
      <div class="container">
        <div class="section-head section-head--center" data-reveal>
          <span class="eyebrow" data-i18n="choose.eyebrow"></span>
          <h2 data-i18n="choose.title"></h2>
          <p data-i18n="choose.lead"></p>
        </div>

        <div class="choose-grid">
          <a class="choose-card" href="private.html" data-reveal data-delay="1">
            <span class="choose-card__icon" data-icon="home"></span>
            <h3 data-i18n="choose.private_title"></h3>
            <p data-i18n="choose.private_desc"></p>
            <span class="card__link"><span data-i18n="services.view"></span><span data-icon="arrow"></span></span>
          </a>
          <a class="choose-card" href="commercial.html" data-reveal data-delay="2">
            <span class="choose-card__icon" data-icon="building"></span>
            <h3 data-i18n="choose.commercial_title"></h3>
            <p data-i18n="choose.commercial_desc"></p>
            <span class="card__link"><span data-i18n="services.view"></span><span data-icon="arrow"></span></span>
          </a>
        </div>
      </div>
    </section>

    <!-- ============ CUSTOMER LOGOS (seamless loop) ============ -->
    <section class="customers" aria-label="Kunder">
      <div class="container">
        <p class="customers__title" data-i18n="customers.title"></p>
      </div>
      <div class="marquee" data-marquee>
        <div class="marquee__track">
          <div class="marquee__set">
            <img class="marquee__logo" src="assets/img/customer-taurus.png" width="320" height="320" alt="Taurus Ejendomsforvaltning" />
            <img class="marquee__logo" src="assets/img/customer-cobblestone.png" width="200" height="200" alt="Cobblestone" />
            <img class="marquee__logo marquee__logo--tile" src="assets/img/customer-home-earth.jpg" width="200" height="200" alt="Home.Earth" />
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CUSTOM TEASER ============ -->
    <section class="section section--photo" id="custom">
      <img class="sec-bg" src="assets/img/home-plan.jpg" alt="" aria-hidden="true"  loading="lazy" decoding="async" />
      <span class="sec-overlay"></span>
      <div class="container">
        <div class="section-head" data-reveal style="max-width:680px">
          <span class="eyebrow" data-i18n="custom.eyebrow"></span>
          <h2 style="font-size:clamp(1.9rem,5vw,3rem)" data-i18n="custom.title"></h2>
          <p data-i18n="custom.body"></p>
          <div class="hero__cta" style="margin-top:1.8rem">
            <a class="btn btn--primary" href="custom.html">
              <span data-i18n="nav.custom"></span><span data-icon="arrow"></span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ ABOUT ============ -->
    <section class="section section--photo" id="about">
      <img class="sec-bg" src="assets/img/home-build.jpg" alt="" aria-hidden="true"  loading="lazy" decoding="async" />
      <span class="sec-overlay"></span>
      <div class="container">
        <div class="split split--reverse">
          <aside class="approach" data-reveal>
            <h3 data-i18n="quality.approach_title"></h3>
            <ul class="checklist">
              <li><span data-icon="check"></span><span data-i18n="quality.approach_1"></span></li>
              <li><span data-icon="check"></span><span data-i18n="quality.approach_2"></span></li>
              <li><span data-icon="check"></span><span data-i18n="quality.approach_3"></span></li>
            </ul>
            <p style="color:var(--text-muted);margin-top:1.4rem;font-size:0.95rem" data-i18n="quality.partner"></p>
          </aside>
          <div data-reveal data-delay="2">
            <span class="eyebrow" data-i18n="about.eyebrow"></span>
            <h2 style="font-size:clamp(1.9rem,5vw,3rem)" data-i18n="about.title"></h2>
            <p style="color:var(--text-muted);margin-top:1rem" data-i18n="about.p1"></p>
            <p style="color:var(--text-muted);margin-top:1rem" data-i18n="about.p2"></p>
            <div class="hero__cta" style="margin-top:1.8rem">
              <a class="btn btn--ghost" href="about.html">
                <span data-i18n="quality.about_link"></span><span data-icon="arrow"></span>
              </a>
            </div>
          </div>
        </div>

        <div style="margin-top:clamp(3rem,6vw,4.5rem)">
          <h3 style="font-size:1.3rem;margin-bottom:1.4rem" data-i18n="about.do_title"></h3>
          <ul class="checklist" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0.9rem 2rem" data-reveal>
            <li><span data-icon="check"></span><span data-i18n="about.do1"></span></li>
            <li><span data-icon="check"></span><span data-i18n="about.do2"></span></li>
            <li><span data-icon="check"></span><span data-i18n="about.do3"></span></li>
            <li><span data-icon="check"></span><span data-i18n="about.do4"></span></li>
            <li><span data-icon="check"></span><span data-i18n="about.do5"></span></li>
            <li><span data-icon="check"></span><span data-i18n="about.do6"></span></li>
            <li><span data-icon="check"></span><span data-i18n="about.do7"></span></li>
            <li><span data-icon="check"></span><span data-i18n="about.do8"></span></li>
          </ul>
          <p style="color:var(--text-muted);margin-top:2rem;max-width:70ch" data-i18n="about.note"></p>
        </div>

        <div class="stats" style="margin-top:clamp(3rem,6vw,4.5rem)" data-reveal>
          <div class="stat"><strong data-i18n="stat.1"></strong><span data-i18n="stat.1l"></span></div>
          <div class="stat"><strong data-i18n="stat.2"></strong><span data-i18n="stat.2l"></span></div>
          <div class="stat"><strong data-i18n="stat.3"></strong><span data-i18n="stat.3l"></span></div>
          <div class="stat"><strong data-i18n="stat.4"></strong><span data-i18n="stat.4l"></span></div>
        </div>
      </div>
    </section>

    <!-- ============ CTA BAND ============ -->
    <section class="section section--tight">
      <div class="container">
        <div class="cta-band" data-reveal>
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.body"></p>
          <div class="hero__cta">
            <a class="btn btn--primary btn--lg" href="offer.html">
              <span data-i18n="hero.cta_offer"></span>
              <span data-icon="arrow"></span>
            </a>
            <a class="btn btn--ghost btn--lg" href="consultation.html" data-i18n="hero.cta_book"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="section section--photo" id="contact">
      <img class="sec-bg" src="assets/img/home-site.jpg" alt="" aria-hidden="true"  loading="lazy" decoding="async" />
      <span class="sec-overlay"></span>
      <div class="container">
        <div class="section-head">
          <span class="eyebrow" data-i18n="contact.eyebrow"></span>
          <h2 data-i18n="contact.title"></h2>
          <p data-i18n="contact.lead"></p>
        </div>
        <div class="contact-grid">
          <div data-reveal>
            <div class="contact-item">
              <span data-icon="mail"></span>
              <div><small data-i18n="contact.email_l"></small><br /><a href="mailto:Kontakt@regionbyg.dk">Kontakt@regionbyg.dk</a></div>
            </div>
            <div class="contact-item">
              <span data-icon="phone"></span>
              <div><small data-i18n="contact.phone_l"></small><br /><a href="tel:+4530602660">+45 30 60 26 60</a></div>
            </div>
          </div>
          <div data-reveal data-delay="2">
            <div class="contact-item">
              <span data-icon="shield"></span>
              <div><small>CVR</small><br /><p data-i18n="contact.cvr"></p></div>
            </div>
            <div class="contact-item">
              <span data-icon="clock"></span>
              <div><small data-i18n="contact.hours_l"></small><br /><p data-i18n="contact.hours_v"></p></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="rb-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
