<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Skræddersyede løsninger fra Region Byg & Rådgivning, uafhængig rådgivning, myndighedsansøgninger, tegninger, projektledelse og komplet udførelse." />
  <meta name="theme-color" content="#0A0A0A" />
  <title data-i18n="meta.title.custom">Skræddersyede løsninger, Region Byg & Rådgivning</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="mask-icon" href="assets/img/favicon.svg" color="#C8996A" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Region Byg & Rådgivning" />
  <meta property="og:title" content="Skræddersyede løsninger, Region Byg & Rådgivning" />
  <meta property="og:description" content="Skræddersyede løsninger fra Region Byg & Rådgivning, uafhængig rådgivning, myndighedsansøgninger, tegninger, projektledelse og komplet udførelse." />
  <meta property="og:image" content="https://regionbyg.dk/assets/img/banner.jpeg" />
  <meta property="og:url" content="https://regionbyg.dk/custom.html" />
  <link rel="canonical" href="https://regionbyg.dk/custom.html" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
  <script>try{if(localStorage.getItem('rb-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="rb-header"></div>

  <main>
    <section class="section" style="padding-top:clamp(7rem,14vw,9rem)">
      <div class="container">
        <div class="split">
          <div data-reveal>
            <span class="eyebrow" data-i18n="custom.eyebrow"></span>
            <h1 style="font-size:clamp(2rem,5vw,3.2rem)" data-i18n="custom.title"></h1>
            <p style="color:var(--text-muted);margin-top:1rem" data-i18n="custom.body"></p>
            <ul class="checklist" style="margin-top:1.6rem">
              <li><span data-icon="check"></span><span data-i18n="custom.li1"></span></li>
              <li><span data-icon="check"></span><span data-i18n="custom.li2"></span></li>
              <li><span data-icon="check"></span><span data-i18n="custom.li3"></span></li>
              <li><span data-icon="check"></span><span data-i18n="custom.li4"></span></li>
              <li><span data-icon="check"></span><span data-i18n="custom.li5"></span></li>
            </ul>
            <div class="hero__cta" style="margin-top:2rem">
              <a class="btn btn--primary btn--lg" href="offer.html?custom=1">
                <span data-i18n="page.custom_cta"></span><span data-icon="arrow"></span>
              </a>
              <a class="btn btn--ghost btn--lg" href="consultation.html" data-i18n="hero.cta_book"></a>
            </div>
          </div>
          <div class="split__media" data-reveal data-delay="2">
            <img src="assets/img/banner.jpeg" alt="Region Byg projekter" loading="lazy" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="rb-footer"></div>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
