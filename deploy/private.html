  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Region Byg & Rådgivning" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script>try{if(localStorage.getItem('rb-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/styles.css" />

<body>
  <div id="rb-header"></div>

  <main>
    <section class="section section--photo" style="padding-top:clamp(7rem,14vw,9rem)">

      <span class="sec-overlay"></span>
      <div class="container">
        <div class="section-head" data-reveal>
          <span class="eyebrow" data-i18n="private.eyebrow"></span>

        <div class="service-grid" data-service-grid="private"></div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="cta-band" data-reveal>
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.body"></p>
          <div class="hero__cta">
            <a class="btn btn--primary btn--lg" href="offer.html?type=private">
              <span data-i18n="hero.cta_offer"></span><span data-icon="arrow"></span>
            </a>
            <a class="btn btn--ghost btn--lg" href="consultation.html" data-i18n="hero.cta_book"></a>
