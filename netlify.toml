# Netlify config, serves the static site + the booking-notification function
[build]
  publish = "."
  functions = "netlify/functions"

# Friendly URL: POST /api/notify  ->  the function
[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-iW4NzsD1+KRT9kQw8HwEw4wHuFJSubKVh3Ae/XjmVEY='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Images and scripts change rarely; cache them for a day, always revalidate HTML
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
